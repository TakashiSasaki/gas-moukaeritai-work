name: emit-layout-tree-manifest

on:
  pull_request:
    branches:
      - gas.moukaeritai.work

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Apply layout migration in disposable checkout
        run: python automation/maintenance/migrate-project-layout.py --apply
      - name: Emit Git tree manifest chunk
        run: python automation/maintenance/emit-layout-tree-manifest.py --chunk "${{ matrix.chunk }}" --chunks 8
