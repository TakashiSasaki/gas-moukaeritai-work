name: validate-automation

on:
  pull_request:
    branches:
      - gas.moukaeritai.work
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install current Python runtime dependencies
        run: python -m pip install requests

      - name: Validate automation and repository state
        run: python .github/scripts/validate-automation.py

      - name: Verify canonical public project index
        run: |
          python automation/stage-1-inventory/generate-public-project-index.py
          git diff --exit-code -- docs/projects.json

      - name: Check Project Explorer JavaScript syntax
        run: node --check docs/index.js

      - name: Run automation unit tests
        run: PYTHONPATH=. python -m unittest discover -s automation/tests -p 'test_*.py'
