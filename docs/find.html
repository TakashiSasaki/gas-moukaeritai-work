<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS Project Explorer</title>
    <link rel="canonical" href="https://gas.moukaeritai.work/">
    <meta name="description" content="Search and browse Google Apps Script projects on gas.moukaeritai.work.">
    <meta name="theme-color" content="#1e6b52">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-end gap-2 mb-4">
            <a href="https://moukaeritai.work" class="btn btn-sm btn-outline-secondary">moukaeritai.work</a>
            <a href="https://gas.moukaeritai.work" class="btn btn-sm btn-outline-secondary">gas.moukaeritai.work</a>
            <a href="https://github.com/codespaces" class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener">GitHub Codespaces</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4">GAS Project Explorer に移動します</h1>
                <p class="text-secondary mb-3">
                    検索機能はトップページへ統合されました。自動的に移動しない場合は下のリンクを使用してください。
                </p>
                <a id="explorer-link" href="/" class="btn btn-primary">Project Explorer を開く</a>
            </div>
        </div>
    </main>
    <footer class="container pb-5 text-center text-secondary small">
        <span>&copy; 2025 Takashi Sasaki. All Rights Reserved.</span>
        <span class="mx-2">·</span>
        <a href="https://x.com/TakashiSasaki" target="_blank" rel="noopener">Takashi Sasaki on X</a>
    </footer>
    <script>
        (() => {
            const current = new URL(window.location.href);
            const target = new URL("/", window.location.origin);
            const project = current.searchParams.get("project");
            if (project) {
                target.searchParams.set("project", project);
            }
            document.getElementById("explorer-link").href = target.toString();
            window.location.replace(target.toString());
        })();
    </script>
</body>
</html>
